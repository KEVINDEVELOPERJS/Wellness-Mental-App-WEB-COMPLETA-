version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wellness_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wellness_mental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness_network

  redis:
    image: redis:7-alpine
    container_name: wellness_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellness_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/wellness_mental?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      REFRESH_TOKEN_SECRET: your-refresh-token-secret-change-in-production
      ENCRYPTION_KEY: your-32-character-encryption-key
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      VAPID_PUBLIC_KEY: your-vapid-public-key
      VAPID_PRIVATE_KEY: your-vapid-private-key
      VAPID_EMAIL: mailto:your-email@example.com
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      EMAIL_FROM: noreply@wellness.com
      OPENAI_API_KEY: your-openai-api-key
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - wellness_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wellness_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_SOCKET_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - wellness_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  wellness_network:
    driver: bridge
